domain_name: "Transformer and foundation models"
slug: "transformer_foundation_models"
search_query: '("statistical machine translation" OR "phrase-based machine translation" OR "language model" OR "word embedding" OR "sequence-to-sequence" OR "attention mechanism" OR "neural machine translation" OR "self-attention" OR "transformer architecture" OR "attention is all you need" OR "pre-trained language model" OR "BERT" OR "large language model" OR "foundation model")'
start_year: 2002
end_year: 2026
window_size: 5
language: "en"
include_abstract: false
max_works_per_window: 1600
fetch_anchor_citers: true
max_anchor_citers: 800
work_types: ["article", "preprint", "review"]
anchors:
  - label: "Vaswani 2017"
    doi: "10.48550/arXiv.1706.03762"
    year: 2017
  - label: "BERT 2018"
    doi: "10.48550/arXiv.1810.04805"
    year: 2018
  - label: "GPT-3 2020"
    doi: "10.48550/arXiv.2005.14165"
    year: 2020
api:
  sleep_seconds: 0.1
  max_retries: 6
  timeout_seconds: 60
  per_page: 100
graph:
  max_papers_for_graph: 4500
  max_edges: 150000
  min_shared_references: 1
  min_cocitations: 1
  community_resolution: 2.2
  random_seed: 42
metrics:
  curve_mode: "raw"
  betweenness_sample: 250
  semantic_sample: 600
plot:
  title: "Fig. 1 | Citation knowledge-graph perturbation after a landmark innovation"
  subtitle: "Example domain: Transformer and foundation models. Real OpenAlex data; publication-style display uses data-derived topic snapshots."
  fig_width_single: 22
  fig_height_single: 11.0
  dpi: 300
  display_mode: "cluster_schematic"
  display_max_topics: 8
  display_min_topic_size: 8
  display_max_backbone_edges: 15
  display_extra_edges: 6
  cluster_radius_min: 0.135
  cluster_radius_max: 0.235
  max_representative_papers: 6
  min_papers_per_display_topic: 3
  max_labels_per_panel: 8
  node_size_min: 64
  show_internal_cluster_edges: true
  show_time_axis: true
  show_panel_captions: true
  metric_x_axis: "years"
  metric_scale: "unit"
  metric_panel_title: "Dominant parameter trajectories explaining the graph transitions in panel a"
  metric_y_label: "Standardized\nparameter value"
  metric_landmark_label: ""
  landmark_focus_year: 2017
  dominant_parameter_ylim: [-1.5, 1.5]
  dominant_parameters:
    - key: "B"
      label: "$B$ (bridge centrality)"
    - key: "RTD"
      label: "RTD (reference target diversity)"
    - key: "Uzzi"
      label: "Uzzi novelty (-p10)"
    - key: "DeltaQ"
      label: "$\\Delta Q$ directionality"
  parameter_callouts:
    - parameter: "B"
      window: "landmark"
      text: "architecture-level\nbridging"
      dx: -4.0
      dy: 0.35
      color: "#1D4ED8"
    - parameter: "Uzzi"
      window: "landmark"
      text: "atypical model\nrecombination"
      dx: 2.2
      dy: 0.35
      color: "#7C3AED"
    - parameter: "RTD"
      window: "2020-2024"
      text: "standardization into\nfoundation-model hubs"
      dx: -3.8
      dy: 0.30
      color: "#F97316"
  parameter_interpretation_boxes:
    - title: "Bridging"
      formula: "B up + RTD up"
      description: "Architecture-level communities connect"
      icon: "bridge"
      color: "#1D4ED8"
    - title: "Novelty"
      formula: "Uzzi up"
      description: "Attention-only recombination is atypical"
      icon: "novelty"
      color: "#7C3AED"
    - title: "Standardization"
      formula: "Uzzi down; B high"
      description: "Convergence into foundation-model hubs"
      icon: "target"
      color: "#F97316"
  parameter_box_width: 0.18
  parameter_box_height: 0.34
  parameter_box_gap: 0.035
  parameter_box_y: -0.56
  parameter_box_title_size: 7.8
  parameter_box_formula_size: 8.2
  parameter_box_description_size: 7.0
  parameter_box_show_icons: false
  parameter_box_corner_radius: 5.0
  parameter_box_linewidth: 0.75
  parameter_box_icon_size: 34
  show_retrieval_date: false
  panel_captions:
    - "Statistical NLP priors"
    - "Phrase-based MT and LMs"
    - "Neural sequence consolidation"
    - "Innovation shock: self-attention"
    - "Compression into foundation models"
  topic_layout_templates:
    - name: "Statistical MT\n& language models"
      x: -0.78
      y: 0.42
      keywords: ["statistical machine translation", "phrase-based", "phrase based", "n-gram", "ngram", "language model", "bleu", "translation model"]
    - name: "Word\nembeddings"
      x: -0.30
      y: 0.55
      keywords: ["word embedding", "word embeddings", "embedding", "embeddings", "word2vec", "glove", "distributional", "semantic vector"]
    - name: "RNN / seq2seq\nmodels"
      x: -0.35
      y: -0.15
      keywords: ["recurrent", "lstm", "gru", "sequence-to-sequence", "seq2seq", "encoder decoder", "encoder-decoder", "neural machine translation"]
    - name: "Attention\nmechanisms"
      x: 0.05
      y: 0.25
      keywords: ["attention", "alignment", "bahdanau", "luong", "memory network", "context vector", "soft attention"]
    - name: "Transformer /\nself-attention"
      x: 0.34
      y: -0.15
      keywords: ["transformer", "self-attention", "self attention", "multi-head", "multihead", "positional encoding", "attention is all you need"]
    - name: "Pretraining\n& BERT"
      x: 0.72
      y: 0.38
      keywords: ["bert", "pretraining", "pre-trained", "pre trained", "masked language model", "contextual", "elmo", "representation learning"]
    - name: "Large language\nmodels"
      x: 0.82
      y: -0.20
      keywords: ["large language model", "large language models", "llm", "gpt", "generative pre-trained", "prompt", "in-context", "instruction tuning"]
    - name: "Foundation &\nmultimodal models"
      x: 0.24
      y: -0.72
      keywords: ["foundation model", "foundation models", "multimodal", "vision-language", "clip", "diffusion", "generative ai", "alignment"]
