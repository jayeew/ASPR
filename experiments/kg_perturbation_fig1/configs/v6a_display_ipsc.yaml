    - "dioxin-binding"
    - "surfactant protein"
    - "btk-deficient"
    - "syk-deficient"
api:
  sleep_seconds: 0.1
  max_retries: 6
  timeout_seconds: 60
  per_page: 100
graph:
  max_papers_for_graph: 4500
  max_edges: 150000
  min_shared_references: 1
  min_cocitations: 1
  community_resolution: 2.2
  random_seed: 42
metrics:
  curve_mode: "raw"
  signed_compression: true
  betweenness_sample: 250
  semantic_sample: 600
plot:
  title: "Fig. 1 | Citation knowledge-graph perturbation after a landmark innovation"
  subtitle: "Example domain: iPSC and cellular reprogramming. Real OpenAlex data; publication-style display uses data-derived topic snapshots."
  fig_width_single: 22
  fig_height_single: 11.0
  dpi: 300
  display_mode: "cluster_schematic"
  display_max_topics: "auto"
  display_max_topics_auto_cap: 8
  adaptive_display_topics: true
  event_topics_per_spec: 1
  event_max_topics: 5
  display_min_topic_size: 8
  display_max_backbone_edges: 18
  display_extra_edges: 8
  edge_gain_highlight_ratio: 0.12
  edge_gain_highlight_min: 4.0
  cluster_radius_min: 0.135
  cluster_radius_max: 0.235
  max_representative_papers: 6
  min_papers_per_display_topic: 3
  max_labels_per_panel: 8
  node_size_min: 64
  show_internal_cluster_edges: true
  show_time_axis: true
  show_panel_captions: true
  metric_x_axis: "years"
  metric_scale: "unit"
