domain_name: "iPSC and cellular reprogramming"
slug: "ipsc_reprogramming"
search_query: '("induced pluripotent stem cell" OR "induced pluripotent stem cells" OR "iPSC" OR "iPS cells" OR "cellular reprogramming" OR "Yamanaka factors" OR "pluripotency" OR "pluripotent stem cell" OR "embryonic stem cell" OR "somatic cell nuclear transfer")'
search_groups:
  - name: "stem_cell_priors"
    query: '("embryonic stem cell" OR "pluripotent stem cell" OR "pluripotency" OR "somatic cell nuclear transfer" OR "therapeutic cloning")'
    max_works_per_window: 520
  - name: "reprogramming_factors"
    query: '("cellular reprogramming" OR "Yamanaka factors" OR "Oct4" OR "Sox2" OR "Klf4" OR "c-Myc" OR "Nanog")'
    max_works_per_window: 620
  - name: "ipsc_platform"
    query: '("induced pluripotent stem cell" OR "induced pluripotent stem cells" OR "iPSC" OR "iPS cells" OR "patient-specific iPS")'
    max_works_per_window: 760
  - name: "ipsc_applications"
    query: '("iPSC disease model" OR "induced pluripotent stem cell disease model" OR "iPSC differentiation" OR "iPSC organoid" OR "iPSC regenerative medicine")'
    max_works_per_window: 620
start_year: 2006
end_year: 2024
window_size: 5
custom_windows:
  - [2006, 2008]
  - [2009, 2011]
  - [2012, 2014]
  - [2015, 2018]
  - [2019, 2024]
snapshot_years: [2008, 2011, 2014, 2018, 2024]
language: "en"
include_abstract: false
max_works_per_window: 1600
fetch_anchor_citers: true
max_anchor_citers: 800
work_types: ["article", "preprint", "review"]
anchors:
  - label: "Takahashi/Yamanaka 2006"
    openalex_id: "W2125987139"
    doi: "10.1016/j.cell.2006.07.024"
    title: "Induction of Pluripotent Stem Cells from Mouse Embryonic and Adult Fibroblast Cultures by Defined Factors"
    year: 2006
  - label: "Takahashi 2007"
    openalex_id: "W2138977668"
    doi: "10.1016/j.cell.2007.11.019"
    title: "Induction of Pluripotent Stem Cells from Adult Human Fibroblasts by Defined Factors"
    year: 2007
  - label: "Yu 2007"
    openalex_id: "W2142046859"
    doi: "10.1126/science.1151526"
    title: "Induced Pluripotent Stem Cell Lines Derived from Human Somatic Cells"
    year: 2007
relevance_filter:
  enabled: true
  keep_anchor_citers: true
  strong_positive_keywords:
    - "induced pluripotent stem cell"
    - "induced pluripotent stem cells"
    - "ipsc"
    - "ips cell"
    - "ips cells"
    - "cellular reprogramming"
    - "yamanaka"
    - "reprogramming factors"
    - "patient-specific ips"
  positive_keywords:
    - "induced pluripotent"
    - "ipsc"
    - "ips cell"
    - "ips cells"
    - "cellular reprogramming"
    - "reprogramming"
    - "yamanaka"
    - "oct4"
    - "sox2"
    - "klf4"
    - "c-myc"
    - "nanog"
    - "pluripotency"
    - "pluripotent stem"
    - "embryonic stem"
    - "somatic cell nuclear transfer"
    - "fibroblast"
    - "disease model"
    - "directed differentiation"
    - "organoid"
    - "regenerative medicine"
  negative_primary_topics:
    - "parallel computing"
    - "toxic organic pollutants"
    - "renal and related cancers"
    - "neonatal respiratory"
    - "t-cell and b-cell immunology"
    - "3d printing"
