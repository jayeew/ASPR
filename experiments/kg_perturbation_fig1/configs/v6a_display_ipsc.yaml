  metric_y_label: "Standardized\nparameter value"
  metric_landmark_label: "iPSC platform"
  landmark_focus_year: 2006
  top_landmark_label: "2006-2007\niPSC reprogramming"
  dominant_parameter_ylim: [-1.5, 1.5]
  dominant_parameters:
    - key: "RTD"
      label: "RTD (reference target diversity)"
    - key: "BurtIP"
      label: "Burt IP (structural holes)"
    - key: "B"
      label: "$B$ (bridge centrality)"
    - key: "DeltaQ"
      label: "$\\Delta Q$ directionality"
  parameter_callouts:
    - parameter: "BurtIP"
      window: "landmark"
      text: "structural-hole\nrecombination"
      dx: -3.5
      dy: 0.35
      color: "#0891B2"
    - parameter: "B"
      window: "landmark"
      text: "pluripotency /\nsomatic bridge"
      dx: 2.5
      dy: 0.30
      color: "#1D4ED8"
    - parameter: "DeltaQ"
      window: "landmark"
      text: "stem-cell field\nreorganization"
      dx: 1.0
      dy: 0.55
      color: "#166534"
  parameter_interpretation_boxes:
    - title: "Recombination"
      formula: "RTD up + Burt IP up"
      description: "Structural holes are recombined"
      icon: "novelty"
      color: "#0891B2"
    - title: "Bridging"
      formula: "B up"
      description: "Somatic identity meets pluripotency"
      icon: "bridge"
      color: "#1D4ED8"
    - title: "Reorganization"
      formula: "DeltaQ < 0"
      description: "Stem-cell boundaries are reorganized"
      icon: "boundary"
      color: "#166534"
  parameter_box_width: 0.18
  parameter_box_height: 0.34
  parameter_box_gap: 0.035
  parameter_box_y: -0.56
  parameter_box_title_size: 7.8
  parameter_box_formula_size: 8.2
  parameter_box_description_size: 7.0
  parameter_box_show_icons: false
