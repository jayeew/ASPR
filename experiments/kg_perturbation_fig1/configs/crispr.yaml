domain_name: "CRISPR-Cas genome editing"
slug: "crispr"
search_query: '("CRISPR" OR "Cas9" OR "Cas12" OR "Cas13" OR "RNA-guided nuclease" OR "guide RNA" OR "genome editing")'
search_groups:
  - name: "adaptive_immunity"
    query: '("CRISPR" OR "clustered regularly interspaced short palindromic repeats" OR "CRISPR-Cas" OR "CRISPR loci" OR "CRISPR spacer" OR "adaptive bacterial immunity")'
    max_works_per_window: 520
  - name: "cas9_editing"
    query: '("Cas9" OR "RNA-guided nuclease" OR "single guide RNA" OR "sgRNA" OR "CRISPR genome editing" OR "CRISPR-Cas9")'
    max_works_per_window: 760
  - name: "new_editors"
    query: '("Cas12" OR "Cpf1" OR "Cas13" OR "base editing" OR "prime editing" OR "CRISPR editor")'
    max_works_per_window: 620
  - name: "screens_therapy"
    query: '("CRISPR screen" OR "CRISPR screening" OR "pooled CRISPR" OR "CRISPR diagnostics" OR "CRISPR therapy" OR "CRISPR delivery")'
    max_works_per_window: 620
start_year: 2000
end_year: 2024
window_size: 5
custom_windows:
  - [2000, 2009]
  - [2010, 2014]
  - [2015, 2019]
  - [2020, 2024]
snapshot_years: [2009, 2014, 2019, 2024]
language: "en"
include_abstract: false
max_works_per_window: 1600
fetch_anchor_citers: true
max_anchor_citers: 800
work_types: ["article", "preprint", "review"]
anchors:
  - label: "Jinek 2012"
    openalex_id: "W2045435533"
    doi: "10.1126/science.1225829"
    title: "A Programmable Dual-RNA-Guided DNA Endonuclease in Adaptive Bacterial Immunity"
    year: 2012
  - label: "Cong/Mali 2013"
    openalex_id: "W2064815984"
    doi: "10.1126/science.1231143"
    title: "Multiplex Genome Engineering Using CRISPR/Cas Systems"
    year: 2013
  - label: "Mali 2013"
    openalex_id: "W2003171404"
    doi: "10.1126/science.1232033"
    title: "RNA-Guided Human Genome Engineering via Cas9"
    year: 2013
relevance_filter:
  enabled: true
  keep_anchor_citers: true
  strong_positive_keywords:
    - "crispr"
    - "crispr-cas"
    - "cas9"
    - "cas12"
    - "cas13"
    - "cpf1"
    - "rna-guided nuclease"
    - "single guide rna"
    - "sgrna"
    - "genome editing"
    - "gene editing"
    - "base editing"
    - "prime editing"
  positive_keywords:
    - "crispr"
    - "cas9"
    - "cas12"
    - "cas13"
    - "cpf1"
    - "rna-guided"
    - "guide rna"
    - "sgrna"
    - "crrna"
    - "tracrrna"
    - "nuclease"
    - "genome editing"
    - "gene editing"
    - "base editing"
    - "prime editing"
    - "bacterial immunity"
    - "spacer acquisition"
    - "pooled screen"
    - "crispr screen"
    - "diagnostics"
  negative_primary_topics:
