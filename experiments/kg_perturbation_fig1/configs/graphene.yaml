domain_name: "Graphene and 2D materials"
slug: "graphene_2d_materials"
search_query: '("graphene" OR "single-layer graphite" OR "atomically thin carbon" OR "two-dimensional material" OR "two-dimensional materials" OR "2D materials" OR "transition metal dichalcogenide" OR "MoS2" OR "van der Waals heterostructure" OR "van der Waals heterostructures")'
start_year: 1990
end_year: 2014
window_size: 5
language: "en"
include_abstract: false
max_works_per_window: 1600
fetch_anchor_citers: true
max_anchor_citers: 800
work_types: ["article", "preprint", "review"]
anchors:
  - label: "Novoselov 2004"
    doi: "10.1126/science.1102896"
    year: 2004
api:
  sleep_seconds: 0.1
  max_retries: 6
  timeout_seconds: 60
  per_page: 100
graph:
  max_papers_for_graph: 4500
  max_edges: 150000
  min_shared_references: 1
  min_cocitations: 1
  community_resolution: 2.2
  random_seed: 42
metrics:
  curve_mode: "raw"
  betweenness_sample: 250
  semantic_sample: 600
plot:
  title: "Fig. 1 | Citation knowledge-graph perturbation after a landmark innovation"
  subtitle: "Example domain: Graphene and 2D materials. Real OpenAlex data; publication-style display uses data-derived topic snapshots."
  fig_width_single: 22
  fig_height_single: 11.0
  dpi: 300
  display_mode: "cluster_schematic"
  display_max_topics: 8
  display_min_topic_size: 8
  display_max_backbone_edges: 15
  display_extra_edges: 6
  cluster_radius_min: 0.135
  cluster_radius_max: 0.235
  max_representative_papers: 6
  min_papers_per_display_topic: 3
  max_labels_per_panel: 8
  node_size_min: 64
  show_internal_cluster_edges: true
  show_time_axis: true
  show_panel_captions: true
  metric_x_axis: "years"
  metric_scale: "unit"
  metric_panel_title: "Dominant parameter trajectories explaining the graph transitions in panel a"
  metric_y_label: "Standardized\nparameter value"
  metric_landmark_label: ""
  dominant_parameter_ylim: [-1.5, 1.5]
  dominant_parameters:
    - key: "RS"
      label: "RS (reference span)"
    - key: "PDE"
      label: "PDE (diffusion potential)"
    - key: "Uzzi"
      label: "Uzzi novelty (-p10)"
    - key: "DeltaQ"
      label: "$\\Delta Q$ directionality"
  parameter_callouts:
    - parameter: "RS"
      window: "2005-2009"
      text: "expansion across\ndisciplines"
      dx: -3.2
      dy: 0.35
      color: "#0F766E"
    - parameter: "PDE"
      window: "2005-2009"
      text: "application\ndiffusion"
      dx: 2.4
      dy: 0.30
      color: "#B45309"
    - parameter: "DeltaQ"
      window: "2010-2014"
      text: "stable 2D-materials\nfield formation"
      dx: -3.6
      dy: 0.40
      color: "#166534"
  parameter_interpretation_boxes:
    - title: "Expansion"
      formula: "RS up + PDE up"
      description: "Physics, materials and devices connect"
      icon: "bridge"
      color: "#0F766E"
    - title: "Novelty"
      formula: "Uzzi up"
      description: "Atypical recombination of carbon physics"
      icon: "novelty"
      color: "#7C3AED"
    - title: "Field formation"
      formula: "DeltaQ later > 0"
      description: "Stable 2D-materials subfield emerges"
      icon: "target"
      color: "#166534"
  parameter_box_width: 0.18
  parameter_box_height: 0.34
  parameter_box_gap: 0.035
  parameter_box_y: -0.56
  parameter_box_title_size: 7.8
  parameter_box_formula_size: 8.2
  parameter_box_description_size: 7.0
  parameter_box_show_icons: false
  parameter_box_corner_radius: 5.0
  parameter_box_linewidth: 0.75
  parameter_box_icon_size: 34
  show_retrieval_date: false
  panel_captions:
    - "Carbon nanomaterial priors"
    - "Graphene isolation shock"
    - "2D-materials expansion"
    - "van der Waals reconfiguration"
    - "Compression into device hubs"
  topic_layout_templates:
    - name: "Carbon\nprecursors"
      x: -0.78
      y: 0.42
      keywords: ["graphite", "carbon", "nanotube", "fullerene", "thin film", "exfoliation", "carbon nanomaterial"]
    - name: "Graphene\nisolation"
      x: -0.15
      y: 0.55
      keywords: ["graphene", "single-layer graphite", "monolayer", "atomically thin", "electric field effect", "isolated", "scotch tape"]
    - name: "Electronic\ntransport"
      x: 0.55
      y: 0.24
      keywords: ["transport", "mobility", "quantum hall", "dirac", "fermion", "conductance", "electronic", "carrier"]
    - name: "Synthesis &\nCVD growth"
      x: -0.36
      y: -0.20
      keywords: ["synthesis", "growth", "chemical vapor deposition", "cvd", "epitaxial", "large area", "substrate", "wafer"]
    - name: "2D materials\nexpansion"
      x: 0.34
      y: -0.37
      keywords: ["two-dimensional", "2d material", "2d materials", "mos2", "ws2", "wse2", "transition metal dichalcogenide", "tmd"]
    - name: "van der Waals\nheterostructures"
      x: 0.15
      y: -0.76
      keywords: ["van der waals", "heterostructure", "heterostructures", "stacked", "twisted", "moire", "twistronics", "bilayer"]
    - name: "Devices &\nsensors"
      x: -0.73
      y: -0.42
      keywords: ["device", "devices", "transistor", "sensor", "sensors", "photodetector", "optoelectronic", "field-effect"]
    - name: "Energy &\ncomposites"
      x: 0.82
      y: 0.42
      keywords: ["energy", "battery", "supercapacitor", "electrode", "composite", "graphene oxide", "reduced graphene oxide", "catalyst"]
