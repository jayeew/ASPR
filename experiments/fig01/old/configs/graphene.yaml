domain_name: "Graphene and 2D materials"
slug: "graphene_2d_materials"
search_query: '("graphene" OR "single-layer graphite" OR "atomically thin carbon" OR "two-dimensional material" OR "two-dimensional materials" OR "2D materials" OR "transition metal dichalcogenide" OR "MoS2" OR "van der Waals heterostructure" OR "van der Waals heterostructures")'
search_groups:
  - name: "graphene_core"
    query: '("graphene" OR "single-layer graphite" OR "atomically thin carbon" OR "monolayer graphene" OR "graphene oxide" OR "reduced graphene oxide")'
    max_works_per_window: 760
  - name: "carbon_precursors"
    query: '("graphite exfoliation" OR "carbon nanotube" OR "fullerene" OR "carbon nanomaterial" OR "thin carbon film")'
    max_works_per_window: 420
  - name: "2d_materials"
    query: '("two-dimensional material" OR "two-dimensional materials" OR "2D materials" OR "monolayer MoS2" OR "two-dimensional MoS2" OR "transition metal dichalcogenide")'
    max_works_per_window: 620
  - name: "vdw_devices"
    query: '("van der Waals heterostructure" OR "van der Waals heterostructures" OR "graphene transistor" OR "graphene sensor" OR "graphene photodetector" OR "graphene supercapacitor")'
    max_works_per_window: 620
