api:
  sleep_seconds: 0.1
  max_retries: 6
  timeout_seconds: 60
  per_page: 100
graph:
  max_papers_for_graph: 5200
  max_edges: 180000
  min_shared_references: 1
  min_cocitations: 1
  community_resolution: 2.15
  random_seed: 42
metrics:
  curve_mode: "raw"
  signed_compression: true
  betweenness_sample: 300
  semantic_sample: 700
plot:
  title: "Fig. 1 | Citation knowledge-graph perturbation after a landmark innovation"
  subtitle: "Example domain: Transformer and foundation models. Real OpenAlex data; display highlights data-derived topic snapshots and post-GPT-3 expansion."
  fig_width_single: 25
  fig_height_single: 11.2
  dpi: 300
  display_mode: "cluster_schematic"
  display_max_topics: "auto"
  display_max_topics_auto_cap: 9
  adaptive_display_topics: true
  event_topics_per_spec: 1
  event_max_topics: 6
  display_min_topic_size: 6
  display_max_backbone_edges: 22
  display_extra_edges: 10
  edge_gain_highlight_ratio: 0.12
  edge_gain_highlight_min: 4.0
  cluster_radius_min: 0.125
  cluster_radius_max: 0.225
  max_representative_papers: 6
  min_papers_per_display_topic: 3
  max_labels_per_panel: 9
  node_size_min: 58
  show_internal_cluster_edges: true
  show_time_axis: true
  show_panel_captions: true
  top_landmark_label: "2017-2020\nTransformer/BERT/GPT-3"
  metric_x_axis: "years"
  metric_scale: "unit"
  metric_panel_title: "Dominant parameter trajectories explaining the graph transitions in panel a"
  metric_y_label: "Standardized\nparameter value"
  metric_landmark_label: "GPT-3 / LLM boom"
  landmark_focus_year: 2020
  dominant_parameter_ylim: [-1.5, 1.5]
  dominant_parameters:
    - key: "B"
      label: "$B$ (bridge centrality)"
    - key: "RTD"
      label: "RTD (reference target diversity)"
    - key: "Uzzi"
      label: "Uzzi novelty (-p10)"
    - key: "DeltaQ"
      label: "$\\Delta Q$ directionality"
  parameter_callouts:
    - parameter: "B"
      window: "2017-2021"
      text: "architecture-level\nbridging"
      dx: -3.0
      dy: 0.35
      color: "#1D4ED8"
    - parameter: "Uzzi"
      window: "2017-2021"
      text: "scaling and\nfew-shot recombination"
      dx: 1.7
      dy: 0.35
      color: "#7C3AED"
    - parameter: "RTD"
      window: "2022-2024"
      text: "LLM boom spreads\nacross applications"
      dx: -3.2
      dy: 0.30
      color: "#F97316"
  parameter_interpretation_boxes:
    - title: "Bridging"
      formula: "B up + RTD up"
      description: "Architecture and pretraining communities connect"
      icon: "bridge"
      color: "#1D4ED8"
    - title: "Novelty"
      formula: "Uzzi up"
      description: "Scaling and prompting recombine references"
      icon: "novelty"
      color: "#7C3AED"
    - title: "Expansion"
      formula: "edge gain + topic birth"
      description: "LLM applications add visible mass"
      icon: "target"
      color: "#F97316"
  parameter_box_width: 0.18
  parameter_box_height: 0.34
  parameter_box_gap: 0.035
  parameter_box_y: -0.56
  parameter_box_title_size: 7.8
  parameter_box_formula_size: 8.2
  parameter_box_description_size: 7.0
  parameter_box_show_icons: false
  parameter_box_corner_radius: 5.0
  parameter_box_linewidth: 0.75
  parameter_box_icon_size: 34
  show_retrieval_date: false
  panel_captions:
    - "Statistical NLP priors"
    - "Phrase-based MT and embeddings"
    - "Neural seq2seq consolidation"
    - "Transformer/BERT/GPT-3 shock"
    - "ChatGPT/GPT-4 LLM boom"
